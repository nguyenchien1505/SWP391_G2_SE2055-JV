spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: jdbc:mysql://localhost:3306/hotel_workforce?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    # Dev dùng CHUNG nguồn schema với các môi trường khác: Flyway là nguồn duy nhất,
    # Hibernate chỉ đối chiếu. Trước đây dev để create-drop + tắt Flyway nên schema
    # dev sinh từ entity còn schema thật sinh từ migration — hai nguồn lệch nhau.
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        type:
          preferred_uuid_jdbc_type: CHAR

  flyway:
    enabled: true
    # Dev được phép xóa sạch và dựng lại: `./mvnw flyway:clean flyway:migrate`
    clean-disabled: false

logging:
  level:
    com.example.SWP391_G2_SE2055_JV: DEBUG
    org.hibernate.SQL: DEBUG
