spring:
  application:
    name: hotel-workforce-management

  datasource:
    url: jdbc:mysql://localhost:3306/hotel_workforce?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 20
        type:
          # Khóa chính toàn hệ thống là uuid (ERD). Mặc định Hibernate 6 map UUID
          # sang BINARY(16) trên MySQL; CHAR khớp với CHAR(36) trong V1__init_schema.sql
          # và đọc được trực tiếp khi query tay. Đổi giá trị này là phải viết migration.
          preferred_uuid_jdbc_type: CHAR

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # ── Google OAuth2 ──────────────────────────────────────────────────────────
  security:
    oauth2:
      client:
        registration:
          google:
            client-id:     ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile
            redirect-uri: "{baseUrl}/auth/callback/google"

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  session:
    timeout: 8h

server:
  port: 8080
  servlet:
    context-path: /api

# Đích redirect sau khi đăng nhập Google. Trước đây hardcode trong
# OAuth2LoginSuccessHandler nên không đổi được theo môi trường.
app:
  frontend:
    success-redirect: http://localhost:3000/dashboard
    unauthorized-redirect: http://localhost:3000/unauthorized
    # BR-USER-07: tài khoản còn mật khẩu tạm phải đổi trước khi vào hệ thống.
    change-password-redirect: http://localhost:3000/change-password

logging:
  level:
    com.example.SWP391_G2_SE2055_JV: DEBUG
    org.springframework.security: DEBUG
    org.springframework.security.web.authentication: DEBUG