spring:
  application:
    name: hotel-workforce-management

  datasource:
    url: jdbc:mysql://localhost:3306/hotel_workforce?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 20
        type:
          # Khóa chính toàn hệ thống là uuid (ERD). Mặc định Hibernate 6 map UUID
          # sang BINARY(16) trên MySQL; CHAR khớp với CHAR(36) trong V1__init_schema.sql
          # và đọc được trực tiếp khi query tay. Đổi giá trị này là phải viết migration.
          preferred_uuid_jdbc_type: CHAR

  flyway:
    enabled: true
    # db/seed: tài khoản test cho mỗi vai trò (R__seed_test_accounts.sql).
    # CHỈ dùng dev/demo — BỎ "classpath:db/seed" khi deploy thật.
    locations: classpath:db/migration,classpath:db/seed
    baseline-on-migrate: true

  # ── Google OAuth2 ──────────────────────────────────────────────────────────
  security:
    oauth2:
      client:
        registration:
          google:
            client-id:     ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile
            redirect-uri: "{baseUrl}/auth/callback/google"

  mail:
    host: smtp.gmail.com
    port: 587
    # Mặc định rỗng: ai không bật email (app.mail.enabled) thì không cần khai báo trong .env.
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          # Không để request treo lâu khi SMTP phản hồi chậm (mili giây).
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  session:
    timeout: 8h

server:
  port: 8080
  servlet:
    context-path: /api

# Đích redirect sau khi đăng nhập Google. Trước đây hardcode trong
# OAuth2LoginSuccessHandler nên không đổi được theo môi trường.
app:
  frontend:
    # Phải khớp route thật của FE (frontend/src/App.jsx), nếu không người dùng rơi vào
    # catch-all và mất luôn thông báo lỗi.
    success-redirect: http://localhost:3000/khach-san
    unauthorized-redirect: http://localhost:3000/dang-nhap?error=oauth_unauthorized
    failure-redirect: http://localhost:3000/dang-nhap?error=oauth_failed
    # BR-USER-07: tài khoản còn mật khẩu tạm phải đổi trước khi vào hệ thống.
    change-password-redirect: http://localhost:3000/doi-mat-khau
    # Link đăng nhập đặt trong email gửi mật khẩu tạm.
    login-url: http://localhost:3000/dang-nhap

  mail:
    # Gửi email mật khẩu tạm khi tạo / cấp lại mật khẩu tài khoản. TẮT mặc định — chỉ bật
    # khi .env có MAIL_ENABLED=true (kèm MAIL_USERNAME/MAIL_PASSWORD: Gmail + App Password).
    # Tắt thì đúng BR-USER-03 / BR-OUT-01: mật khẩu tạm chỉ hiển thị trên màn hình.
    enabled: ${MAIL_ENABLED:false}

logging:
  level:
    com.example.SWP391_G2_SE2055_JV: DEBUG
    org.springframework.security: DEBUG
    org.springframework.security.web.authentication: DEBUG