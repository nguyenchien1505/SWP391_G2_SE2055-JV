spring:
  application:
    name: hotel-workforce-management

  datasource:
    url: jdbc:mysql://localhost:3306/hotel_workforce
    username: root
    password: password
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        default_batch_fetch_size: 20

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:your-email@gmail.com}
    password: ${MAIL_PASSWORD:your-app-password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  # Session configuration (RBAC — no JWT)
  session:
    timeout: 8h   # session expires after 8 hours of inactivity

server:
  port: 8080
  servlet:
    context-path: /api

logging:
  level:
    com.example.SWP391_G2_SE2055_JV: DEBUG
    org.springframework.security: INFO
